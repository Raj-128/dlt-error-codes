name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: data/codes.json must be valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/codes.json','utf8')); console.log('valid')"
      - name: no credentials or project-specific data
        run: npm run leak-check
      - name: package must contain only src and data
        run: npm pack --dry-run
      - name: no placeholders left unfilled
        run: |
          if grep -rn "YOUR_GITHUB_USERNAME\|YOUR NAME HERE\|YOUR FULL LEGAL NAME\|YOUR_EMAIL_HERE" \
               --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Placeholder text still present - fill these in before release"
            exit 1
          fi
          echo "no placeholders found"
