# Publishes to npm with provenance when you push a version tag.
#
#   npm version patch    # or minor / major — this creates the tag
#   git push --follow-tags
#
# Requires a repository secret named NPM_TOKEN: an npm automation token
# (npmjs.com -> Access Tokens -> Generate -> Automation).
# Provenance requires a public repository and id-token: write.

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
